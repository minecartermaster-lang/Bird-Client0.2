name: Build Bird Client

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract Bird Client
        run: |
          unzip -o bird-client.zip -d bird-client

      - name: Find Gradle project
        run: |
          echo "=== GRADLE FILES ==="
          find bird-client -name "build.gradle*" -o -name "settings.gradle*"

      - name: Build Bird Client
        run: |
          PROJECT_DIR=$(dirname "$(find bird-client -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bird-client
          path: "bird-client/**/build/libs/*.jar"
