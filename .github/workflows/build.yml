name: Build Bird Client

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Show project files
        run: |
          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f | sort
          echo "=== JAVA VERSION ==="
          java -version
          echo "=== GRADLE VERSION ==="
          gradle --version

      - name: Build Bird Client
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bird-client
          path: build/libs/*.jar
